; M5Paper 単体サッカー結果掲示板
; SPEC_m5paper_standalone_football.md §1.3 に従い Arduino / M5Unified を使う。

[platformio]
default_envs = m5paper

; ---------------------------------------------------------------------------
; 実機ビルド
; ---------------------------------------------------------------------------
[env:m5paper]
platform = espressif32@6.9.0
; PlatformIO の espressif32 には M5Paper 専用の board 定義が無い。
; M5Paper は ESP32-D0WDQ6-V3 + 16MB flash + PSRAM なので m5stack-fire が一致する。
; 実際の機種判別は M5Unified が実行時に行う (起動ログの board 名で確認すること)。
board = m5stack-fire
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=3
	; 開発中は電源断の代わりにログ + 長い delay に切り替える (§6.2-3)
	; -DDEV_NO_POWEROFF

lib_deps =
	m5stack/M5Unified@^0.2.2
	bblanchon/ArduinoJson@^7.2.0

; ---------------------------------------------------------------------------
; ネイティブ単体テスト (§4.3)
; デバイス非依存のコアだけをビルドする。M5 / WiFi に依存するファイルは含めない。
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; src/core/ をテストバイナリに一緒にリンクする
test_build_src = yes
build_flags =
	-std=c++17
	-DUNIT_TEST
	-I src
build_src_filter =
	-<*>
	+<core/>
lib_deps =
	bblanchon/ArduinoJson@^7.2.0
